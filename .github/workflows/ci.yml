name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static:
    name: typecheck / lint / schema-drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Fail on runtime schema-drift fallbacks
        run: npm run check:schema-drift

  migrate:
    name: apply migrations against ephemeral postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: echorating_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/echorating_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply Supabase-compat scaffolding
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db-ci-bootstrap.sql
      - name: Apply baseline schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f lib/db/migrations/schema_v2_improved.sql
      - name: Mark baseline as applied
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); insert into public.schema_migrations (name) values ('schema_v2_improved.sql') on conflict (name) do nothing;"
      - name: Apply all dated migrations
        run: npm run db:migrate
      - name: Verify no drift
        run: npm run db:check

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unit
